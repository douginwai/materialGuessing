<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>配料猜猜猜 🦊</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <!-- 图标 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 加载遮罩 */
    #loading {
      position: fixed; inset: 0;
      z-index: 100;
      background: #FFF8EE;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .fox-icon { font-size: 60px; animation: bounce 1s infinite; }
    #loading .title { font-size: 22px; color: #3D3226; font-weight: bold; margin-top: 16px; }
    #loading .subtitle { font-size: 13px; color: #8B7E6F; margin-top: 8px; }
    #loading .spinner { margin-top: 24px; width: 32px; height: 32px; border: 3px solid #E8DDD0; border-top-color: #FF7A33; border-radius: 50%; animation: spin 0.8s linear infinite; }

    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    #gameCanvas { display: block; }

    /* 暗色模式适配 */
    @media (prefers-color-scheme: dark) {
      #loading { background: #222; }
      #loading .title { color: #eee; }
      #loading .subtitle { color: #999; }
    }

    /* 底部提示 */
    #hint {
      position: fixed; bottom: 12px; left: 0; right: 0;
      text-align: center;
      font-size: 11px; color: #666;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 加载遮罩 -->
  <div id="loading">
    <div class="fox-icon">🦊</div>
    <div class="title">配料猜猜猜</div>
    <div class="subtitle">看配料表 · 猜食品 · 涨知识</div>
    <div class="spinner"></div>
  </div>

  <!-- 游戏画布 -->
  <canvas id="gameCanvas" width="375" height="667"></canvas>

  <!-- 底部提示 -->
  <div id="hint">🦊 点按选项答题 · 狐狸等你来挑战</div>

  <script src="bundle.js"></script>

  <script>
    // 页面加载完成后隐藏遮罩
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').classList.add('hidden')
      }, 600)
    })
    // 备用：5秒后强制隐藏
    setTimeout(function() {
      var el = document.getElementById('loading')
      if (el && !el.classList.contains('hidden')) {
        el.classList.add('hidden')
      }
    }, 5000)
  </script>
</body>
</html>
