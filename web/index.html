<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>狐狸的配料食堂 🦊</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#1a1a1a;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}#loading{position:fixed;inset:0;z-index:100;background:#FFF8EE;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}#loading.hidden{opacity:0;pointer-events:none}#loading .icon{font-size:60px;animation:bounce 1s infinite}#loading .t1{font-size:22px;color:#3D3226;font-weight:bold;margin-top:16px}#loading .t2{font-size:13px;color:#8B7E6F;margin-top:8px}#loading .spinner{margin-top:24px;width:32px;height:32px;border:3px solid #E8DDD0;border-top-color:#FF7A33;border-radius:50%;animation:spin .8s linear infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){#loading{background:#222}#loading .t1{color:#eee}#loading .t2{color:#999}}#gameCanvas{display:block}</style></head><body><div id="loading"><div class="icon">🦊</div><div class="t1">狐狸的配料食堂</div><div class="t2">白天经营 · 夜晚研发 · 食谱收集</div><div class="spinner"></div></div><canvas id="gameCanvas" width="375" height="667"></canvas><script src="bundle.js?v=mq3v3yoh"></script><script>window.addEventListener("load",function(){setTimeout(function(){document.getElementById("loading").classList.add("hidden")},600)});setTimeout(function(){var e=document.getElementById("loading");if(e&&!e.classList.contains("hidden"))e.classList.add("hidden")},5000)</script></body></html>
